<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启真湖畔 · 数学系恋爱物语</title>
<style>
  :root{
    --night:#171c33;
    --card:#fdf9ef;
    --ink:#2a2f45;
    --pencil:#7d8195;
    --rose:#e0608a;
    --rose-deep:#c64a73;
    --gold:#e8b54d;
    --green:#3e7d5a;
    --mist:#a9adc4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--night);}
  body{
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:#e9e6f2;
    background:
      radial-gradient(1px 1px at 12% 8%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 38% 4%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 71% 6%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 12%, rgba(255,255,255,.45) 50%, transparent 51%),
      var(--night);
    min-height:100vh;
  }

  /* ===== 黄昏天空头图 ===== */
  .sky{
    position:relative;
    height:208px;
    overflow:hidden;
    background:linear-gradient(180deg,
      #161a36 0%, #322a5c 30%, #6e3d6e 55%, #b85f6c 75%, #e8945f 92%, #f2b06a 100%);
  }
  .sky .moon{
    position:absolute; top:26px; right:14%;
    width:30px; height:30px; border-radius:50%;
    background:#fdf3da;
    box-shadow:0 0 24px 8px rgba(253,243,218,.35);
  }
  .sky .water{
    position:absolute; left:0; right:0; bottom:0; height:46px;
    background:linear-gradient(180deg,#27305c 0%, #141a38 100%);
  }
  .sky .water::before{
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(90deg, transparent 8%, rgba(255,200,150,.22) 30%, transparent 52%) 0 8px/100% 2px no-repeat,
      linear-gradient(90deg, transparent 22%, rgba(255,200,150,.14) 48%, transparent 70%) 0 20px/100% 2px no-repeat,
      linear-gradient(90deg, transparent 40%, rgba(220,180,220,.12) 66%, transparent 86%) 0 32px/100% 1.5px no-repeat;
  }
  .sky .skyline{
    position:absolute; left:0; right:0; bottom:40px; height:34px;
    color:#10142a;
  }
  .swan{
    position:absolute; bottom:30px; right:21%;
    font-size:30px; line-height:1;
    filter:brightness(0) opacity(.92);
  }
  .swan-ref{
    position:absolute; bottom:4px; right:21%;
    font-size:30px; line-height:1;
    transform:scaleY(-1);
    filter:brightness(0) opacity(.18);
  }
  .sym{
    position:absolute;
    font-family:"Songti SC","Noto Serif SC",serif;
    color:rgba(255,236,200,.85);
    text-shadow:0 0 8px rgba(255,220,160,.6);
    animation:floaty 7s ease-in-out infinite alternate;
    user-select:none;
  }
  @keyframes floaty{
    from{transform:translateY(0); opacity:.55;}
    to{transform:translateY(-14px); opacity:.95;}
  }
  .sky .title{
    position:absolute; left:0; right:0; top:52px;
    text-align:center;
  }
  .sky .title h1{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:34px; font-weight:700;
    letter-spacing:10px; text-indent:10px;
    color:#fdf6e8;
    text-shadow:0 2px 18px rgba(0,0,0,.45);
  }
  .sky .title p{
    margin-top:6px;
    font-size:12px; letter-spacing:4px; text-indent:4px;
    color:rgba(253,246,232,.85);
  }

  .wrap{width:100%;max-width:720px;margin:0 auto;padding:0 14px 48px;}

  /* ===== 定理卡 ===== */
  .thm-card{
    margin-top:-26px;
    position:relative; z-index:2;
    background:var(--card);
    color:var(--ink);
    border-radius:10px;
    border-top:3px solid var(--rose);
    padding:12px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    font-family:"Songti SC","Noto Serif SC",serif;
  }
  .thm-card h2{font-size:17px;}
  .thm-card h2 em{font-style:normal;color:var(--rose-deep);}
  .thm-card p{font-size:12.5px;color:#6a6f85;margin-top:4px;line-height:1.7;}

  /* ===== 状态栏 ===== */
  .status{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;
    padding:5px 12px;
    font-size:12.5px;color:#e9e6f2;
    backdrop-filter:blur(4px);
  }
  .chip b{font-weight:600;color:#fff;}
  .bar{width:52px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:3px;transition:width .5s ease;}
  .bar.energy i{background:linear-gradient(90deg,#5fae84,#9fd6b4);}
  .bar.study i{background:linear-gradient(90deg,#e8b54d,#f5d68d);}
  .aff-chip{
    border-color:rgba(224,96,138,.55);
    background:rgba(224,96,138,.14);
    box-shadow:0 0 10px rgba(224,96,138,.18);
  }
  .aff-chip b{color:#ffb3cc;}

  /* ===== 学期数轴 ===== */
  #timeline{margin:2px 0 14px;}
  #timeline svg{width:100%;height:auto;display:block;}
  .tl-num{fill:#9aa0bb;font-size:9px;text-anchor:middle;font-family:"Menlo","SF Mono",monospace;}
  .tl-t{fill:#ff9ebd;font-size:10.5px;text-anchor:middle;font-family:"Menlo","SF Mono",monospace;}
  .tl-dot{fill:var(--rose);animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}

  /* ===== 剧情卡片 ===== */
  #log{display:flex;flex-direction:column;gap:12px;}
  .turn{
    background:var(--card);
    color:var(--ink);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    animation:rise .45s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .player-act{
    display:inline-block;
    font-size:12px;color:#8a6a1f;
    background:rgba(232,181,77,.18);
    border:1px solid rgba(232,181,77,.45);
    border-radius:999px;
    padding:2px 10px;
    margin-bottom:8px;
  }
  .player-act::before{content:"▸ ";}
  .roll{
    display:inline-block;
    font-family:"Menlo","SF Mono",monospace;
    font-size:12px;
    border:1px dashed var(--pencil);
    border-radius:6px;
    padding:2px 9px;
    margin:0 0 8px 6px;
    color:var(--ink);
    background:#fff;
    animation:rollin .4s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes rollin{from{transform:rotate(-12deg) scale(.6);opacity:0;}to{transform:none;opacity:1;}}
  .roll.ok{border-color:var(--green);color:var(--green);}
  .roll.bad{border-color:var(--rose-deep);color:var(--rose-deep);}
  .narr{font-size:15px;line-height:1.9;white-space:pre-wrap;}
  .delta{
    font-size:11.5px;color:var(--pencil);margin-top:9px;
    font-family:"Menlo","SF Mono",monospace;
    border-top:1px dashed #ddd6c4;
    padding-top:7px;
  }
  .delta .up{color:var(--rose-deep);}

  /* ===== 行动区 ===== */
  #actions{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
  .sec-label{font-size:12px;color:var(--mist);letter-spacing:1px;}
  .act-btn{
    text-align:left;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-left:3px solid var(--gold);
    border-radius:8px;
    padding:12px 14px;
    font-size:14.5px;
    color:#f0ecdf;
    cursor:pointer;
    font-family:inherit;
    transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .act-btn:hover{
    background:rgba(255,255,255,.11);
    transform:translateY(-1px);
    box-shadow:0 4px 16px rgba(232,181,77,.18);
  }
  .act-btn:active{transform:none;}
  .act-btn:focus-visible{outline:2px solid var(--rose);outline-offset:2px;}
  .act-btn:disabled{opacity:.45;cursor:default;}
  .act-btn b{color:#ffe9bd;}
  .free-row{display:flex;gap:8px;margin-top:2px;}
  #freeInput{
    flex:1;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;
    padding:11px 13px;
    font-size:14px;font-family:inherit;
    color:#f0ecdf;
  }
  #freeInput::placeholder{color:rgba(233,230,242,.4);}
  #freeInput:focus{outline:2px solid var(--gold);outline-offset:1px;}
  #freeGo{
    border:none;border-radius:8px;
    background:linear-gradient(135deg,var(--rose),var(--rose-deep));
    color:#fff;padding:0 20px;font-size:14px;cursor:pointer;font-family:inherit;
  }
  #freeGo:disabled{opacity:.5;cursor:default;}

  /* ===== 加载 / 结局 ===== */
  #loading{
    display:none;margin-top:14px;
    font-size:13.5px;color:var(--mist);
    font-family:"Menlo","SF Mono",monospace;
  }
  #loading .spin{
    display:inline-block;margin-right:6px;
    font-size:16px;color:var(--gold);
    animation:spin 1.6s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .ending{
    background:var(--card);color:var(--ink);
    border:1.5px solid var(--gold);
    border-radius:10px;
    padding:16px;
    font-size:14.5px;line-height:1.9;
    box-shadow:0 0 26px rgba(232,181,77,.35);
    animation:rise .5s ease;
  }
  .ending h3{
    font-family:"Songti SC","Noto Serif SC",serif;
    color:#a87f25;margin-bottom:7px;
  }
  .restart-btn{
    width:100%;padding:14px;font-size:15px;letter-spacing:3px;
    background:linear-gradient(135deg,var(--gold),#d99c2b);
    color:#3a2c08;border:none;border-radius:8px;
    cursor:pointer;font-family:"Songti SC","Noto Serif SC",serif;font-weight:700;
  }
  .err{color:#ff9ebd;font-size:13px;margin-top:10px;}

  @media (max-width:480px){
    .sky{height:184px;}
    .sky .title h1{font-size:27px;letter-spacing:7px;text-indent:7px;}
    .swan{right:12%;}
    .swan-ref{right:12%;}
  }
  @media (prefers-reduced-motion: reduce){
    .sym,.tl-dot,#loading .spin,.roll{animation:none;}
    .turn,.ending{animation:none;}
  }
</style>
</head>
<body>

<div class="sky">
  <div class="moon"></div>
  <span class="sym" style="left:8%;  top:34%; font-size:15px; animation-delay:0s;">ε</span>
  <span class="sym" style="left:16%; top:58%; font-size:12px; animation-delay:1.2s;">δ</span>
  <span class="sym" style="left:27%; top:26%; font-size:14px; animation-delay:2.1s;">∂</span>
  <span class="sym" style="left:62%; top:30%; font-size:13px; animation-delay:.6s;">∫</span>
  <span class="sym" style="left:73%; top:55%; font-size:12px; animation-delay:1.8s;">Σ</span>
  <span class="sym" style="left:90%; top:48%; font-size:14px; animation-delay:2.6s;">∞</span>
  <span class="sym" style="left:46%; top:62%; font-size:12px; animation-delay:3.2s; color:rgba(255,179,204,.95); text-shadow:0 0 8px rgba(255,140,180,.8);">♥</span>
  <div class="title">
    <h1>启真湖畔</h1>
    <p>数 学 系 恋 爱 物 语</p>
  </div>
  <svg class="skyline" viewBox="0 0 720 34" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path fill="currentColor" d="M0,34 V20 h36 v-8 h14 v8 h28 v6 h40 v-14 h10 v-5 h12 v5 h10 v14 h34 v-9 h26 v9 h52 v-16 h8 v-4 h14 v4 h8 v16 h44 v6 h38 v-12 h30 v12 h48 v-7 h12 v-6 h16 v6 h12 v7 h46 v-15 h10 v15 h36 v5 h40 v-10 h26 v10 h60 V34 Z"/>
  </svg>
  <div class="water"></div>
  <span class="swan">🦢</span>
  <span class="swan-ref">🦢</span>
</div>

<div class="wrap">
  <div class="thm-card">
    <h2>定理 1(<em>恋爱存在性定理</em>)</h2>
    <p>设 X 为紫金港数学系某学生,则在第 1–16 教学周内,存在一段令 X 难忘的相遇。证明:见下。∎</p>
  </div>

  <div class="status" id="status"></div>
  <div id="timeline"></div>
  <div id="log"></div>
  <div id="loading"><span class="spin">∮</span>求解中…</div>
  <div id="actions"></div>
  <div class="err" id="err"></div>
</div>

<script>
const PROXY_URL = "https://api.lacustemporis.com";

const SYSTEM_PROMPT = `你是一个文字恋爱RPG的游戏主持人(GM)。背景:浙江大学紫金港校区,数学科学学院,用"你"称呼玩家。玩家开局会选择性别(男/女/保密),每回合消息中会注明;剧情、称呼与角色互动需符合所选性别,选"保密"则始终避免指明玩家性别。玩家开局自选年级,专业课随年级变化(每回合消息中会注明):大一为数学分析、高等代数、解析几何(分析学/代数学/几何学三大件,新生住蓝田学园,适应期剧情);大二为数值代数、复变函数、微分几何;大三为偏微分方程、泛函分析、随机过程(课业最重,绩点焦虑);大四为两门高难度专业选修(从代数拓扑、黎曼几何、代数数论、随机分析、李群李代数等中由你开局随机指定两门)加每周学术讲座(蒙民伟楼报告厅),并伴随保研/出国/秋招支线。公共课各年级通用:马克思主义基本原理(马原,大班课,有小组展示/pre、点名、抢后排座)、体育课(篮球/羽毛球/游泳等,需跑距打卡)、大学英语。公共课跨学院上课,是结识其他学院角色的天然场景;马原小组作业、体育课组队、夜跑打卡等都可作为剧情素材。

【世界观素材】可自然使用:启真湖与黑天鹅、紫金港图书馆主馆、东区/西区教学楼、风雨操场与篮球场、文化广场、各大食堂、CC98论坛、蓝田学园、校巴、玉泉老校区、银泰城约会、晚上寝室开黑(游戏)、数学建模队、社团活动、期中期末周。

【可攻略角色】由你创造 3~4 名性格鲜明的可攻略大学生角色,以玩家的异性为主(玩家性别为"保密"时则男女皆有)。女生角色可从如下气质中取材并自由发挥:数学系同班学霸少女、图书馆常遇到的文学院女生、习题课助教学姐、竺可桢学院卷王、校排球队/田径队体育特长生、艺术团钢琴伴奏、马原小组里的法学院辩手、食堂总坐同一排的安静女生、CC98上认识的匿名网友(线下意外相认);男生角色同理可有篮球场认识的体育生、习题课助教学长、计算机系开黑队友、文学社社长等。姓名要自然好听,角色应有自己的性格、口头禅和支线;开场只引出 1~2 名,其余角色随剧情在不同场景陆续登场。

【规则】
1. 时间共 16 教学周,每 3~5 个行动推进 1 周;第 8 周期中、第 16 周期末并触发结局。
2. 状态:energy(0~100,行动消耗、休息恢复)、study(0~100,学业,翘课刷好感会降,期中期末按 study 给出成绩剧情)、affection(每角色 0~100)。
3. 玩家消息中会附带本回合 d20 骰值。对有不确定性的行动(搭话、约人、表白、比赛、抢座、考试发挥等)用它判定:≥17 大成功,≥12 成功,6~11 平淡/小波折,≤5 出糗(但出糗可以很可爱,产生新剧情)。判定时在 narrative 第一行写明,如「判定:d20=14 ≥ 12,成功」。日常无风险行动可不判定。
4. 好感度变化每回合控制在 -5~+8;表白需要好感 ≥70 且判定成功才会接受。
5. 文风:轻快、有梗、有画面感,可适度使用数学梗(ε-δ、紧致、收敛、同构等)但不堆砌;每段 narrative 120~220 字;内容健康清新,校园纯爱向。
6. 第 16 周结束后输出结局:根据最高好感与 study 给出结局类型(甜蜜结局/挚友结局/学神孤独结局等),gameOver 设为 true。

【输出格式】只输出一个 JSON 对象,不要任何其他文字、不要 markdown 代码块:
{
 "narrative": "本回合剧情",
 "memory": "不超过120字的累计剧情摘要(含已出场角色名与关键进展)",
 "state": {"week":1,"energy":90,"study":60,"affection":{"角色名":10}},
 "actions": ["选项1","选项2","选项3"],
 "gameOver": false,
 "ending": ""
}`;

const GRADES = {
  "大一": { courses:"数学分析、高等代数、解析几何(分析学/代数学/几何学三大件)" },
  "大二": { courses:"数值代数、复变函数、微分几何" },
  "大三": { courses:"偏微分方程、泛函分析、随机过程" },
  "大四": { courses:"两门由GM随机指定的高难度专业选修 + 每周学术讲座" }
};
let grade = null;
let gender = null;
let state = { week:1, energy:100, study:60, affection:{} };
let memory = "";
let lastNarrative = "";
let busy = false;

const $ = id => document.getElementById(id);

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}

function bar(v, cls){
  return `<span class="bar ${cls}"><i style="width:${v}%"></i></span>`;
}

function renderStatus(){
  let html = `<span class="chip"><b>${grade || "—"}${gender ? " · "+gender : ""}</b></span>
    <span class="chip">精力 <b>${state.energy}</b> ${bar(state.energy,"energy")}</span>
    <span class="chip">学业 <b>${state.study}</b> ${bar(state.study,"study")}</span>`;
  for(const [name,v] of Object.entries(state.affection||{})){
    html += `<span class="chip aff-chip">${escapeHtml(name)} <b>♥ ${v}</b></span>`;
  }
  $("status").innerHTML = html;
  renderTimeline();
}

function renderTimeline(){
  const W=360, H=42, x0=14, x1=330;
  const xi = w => x0 + (w-1)*(x1-x0)/15;
  let ticks = "";
  for(let i=1;i<=16;i++){
    const x = xi(i).toFixed(1);
    const top = (i===1||i===8||i===16) ? 16 : 19;
    ticks += `<line x1="${x}" y1="24" x2="${x}" y2="${top}" stroke="#9aa0bb" stroke-width="1"/>`;
  }
  const cx = xi(Math.min(state.week,16)).toFixed(1);
  $("timeline").innerHTML =
`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-label="学期进度数轴">
  <line x1="${x0-8}" y1="24" x2="${x1+18}" y2="24" stroke="#9aa0bb" stroke-width="1.2"/>
  <path d="M${x1+18},24 l-7,-3.5 v7 Z" fill="#9aa0bb"/>
  ${ticks}
  <text x="${xi(1)}" y="37" class="tl-num">1</text>
  <text x="${xi(8)}" y="37" class="tl-num">8·期中</text>
  <text x="${xi(16)}" y="37" class="tl-num">16·期末</text>
  <text x="${x1+30}" y="28" class="tl-num">周</text>
  <circle cx="${cx}" cy="24" r="4.5" class="tl-dot"/>
  <text x="${cx}" y="11" class="tl-t">t=${state.week}</text>
</svg>`;
}

function diffState(oldS, newS){
  const parts = [];
  if(newS.energy !== oldS.energy){
    const d = newS.energy - oldS.energy;
    parts.push(`精力 ${d>0?"+":""}${d}`);
  }
  if(newS.study !== oldS.study){
    const d = newS.study - oldS.study;
    parts.push(`学业 ${d>0?"+":""}${d}`);
  }
  for(const [name,v] of Object.entries(newS.affection||{})){
    const old = (oldS.affection||{})[name] ?? 0;
    if(v !== old){
      const d = v - old;
      parts.push(`<span class="${d>0?'up':''}">${escapeHtml(name)} ♥${d>0?"+":""}${d}</span>`);
    }
  }
  return parts.join(" · ");
}

function addTurn({playerAction, roll, narrative, delta}){
  const div = document.createElement("div");
  div.className = "turn";
  let html = "";
  if(playerAction) html += `<span class="player-act">${escapeHtml(playerAction)}</span>`;
  if(roll != null){
    const cls = roll >= 12 ? "ok" : (roll <= 5 ? "bad" : "");
    html += `<span class="roll ${cls}">d20 = ${roll}</span>`;
  }
  if(playerAction || roll != null) html += `<div style="height:4px"></div>`;
  html += `<div class="narr">${escapeHtml(narrative)}</div>`;
  if(delta) html += `<div class="delta">Δ: ${delta}</div>`;
  div.innerHTML = html;
  $("log").appendChild(div);
  div.scrollIntoView({behavior:"smooth", block:"end"});
}

function renderActions(actions, gameOver){
  const box = $("actions");
  box.innerHTML = "";
  if(gameOver){
    const btn = document.createElement("button");
    btn.className = "restart-btn";
    btn.textContent = "∎ 重新证明(再玩一局)";
    btn.onclick = () => location.reload();
    box.appendChild(btn);
    return;
  }
  (actions||[]).forEach(a=>{
    const b = document.createElement("button");
    b.className = "act-btn";
    b.textContent = a;
    b.onclick = () => takeAction(a);
    box.appendChild(b);
  });
  const row = document.createElement("div");
  row.className = "free-row";
  row.innerHTML = `<input id="freeInput" maxlength="60" placeholder="或自由输入你的行动…">
                   <button id="freeGo">执行</button>`;
  box.appendChild(row);
  $("freeGo").onclick = ()=>{
    const v = $("freeInput").value.trim();
    if(v) takeAction(v);
  };
  $("freeInput").addEventListener("keydown", e=>{
    if(e.key === "Enter"){
      const v = $("freeInput").value.trim();
      if(v) takeAction(v);
    }
  });
}

function setBusy(b){
  busy = b;
  $("loading").style.display = b ? "block" : "none";
  document.querySelectorAll(".act-btn,#freeGo,.restart-btn").forEach(el=>el.disabled=b);
}

async function callGM(userMsg){
  const resp = await fetch(PROXY_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      messages:[
        { role:"system", content: SYSTEM_PROMPT },
        { role:"user", content: userMsg }
      ],
      max_tokens: 1000
    })
  });
  if(!resp.ok) throw new Error("代理返回 " + resp.status);
  const data = await resp.json();
  const text = data.choices?.[0]?.message?.content || "";
  const clean = text.replace(/```json|```/g,"").trim();
  const start = clean.indexOf("{");
  const end = clean.lastIndexOf("}");
  return JSON.parse(clean.slice(start, end+1));
}

function sanitize(ns, fallback){
  if(!ns || typeof ns !== "object") return fallback;
  const clamp = (v,def)=>{
    v = Number(v); if(isNaN(v)) return def;
    return Math.max(0, Math.min(100, Math.round(v)));
  };
  const aff = {};
  for(const [k,v] of Object.entries(ns.affection||fallback.affection||{})){
    aff[k] = clamp(v, 0);
  }
  let week = Number(ns.week); if(isNaN(week)) week = fallback.week;
  week = Math.max(fallback.week, Math.min(16, Math.round(week)));
  return {
    week,
    energy: clamp(ns.energy, fallback.energy),
    study: clamp(ns.study, fallback.study),
    affection: aff
  };
}

async function takeAction(action){
  if(busy) return;
  const roll = 1 + Math.floor(Math.random()*20);
  setBusy(true);
  $("err").textContent = "";
  const userMsg =
`【玩家性别】${gender}
【年级】${grade},本学期专业课:${GRADES[grade].courses}
【剧情摘要】${memory || "(游戏刚开始)"}
【上回合剧情】${lastNarrative || "(无)"}
【当前状态】${JSON.stringify(state)}
【本回合 d20】${roll}
【玩家行动】${action}
请按格式只输出 JSON。`;
  try{
    const r = await callGM(userMsg);
    const oldState = JSON.parse(JSON.stringify(state));
    state = sanitize(r.state, oldState);
    memory = r.memory || memory;
    lastNarrative = r.narrative || "";
    addTurn({
      playerAction: action,
      roll: roll,
      narrative: r.narrative || "(剧情生成失败,请重试)",
      delta: diffState(oldState, state)
    });
    renderStatus();
    if(r.gameOver){
      const div = document.createElement("div");
      div.className = "ending";
      div.innerHTML = `<h3>∎ 证毕 · 结局</h3>${escapeHtml(r.ending || "这个学期,就这样写进了你的草稿纸里。")}`;
      $("log").appendChild(div);
      div.scrollIntoView({behavior:"smooth", block:"end"});
      renderActions([], true);
    }else{
      renderActions(r.actions, false);
    }
  }catch(e){
    console.error(e);
    $("err").textContent = "剧情生成出了点问题(网络或解析失败),请再点一次行动重试。";
  }finally{
    setBusy(false);
  }
}

function renderGenderSelect(){
  const box = $("actions");
  box.innerHTML = `<div class="sec-label">∎ 选择你的性别</div>`;
  ["男","女","保密"].forEach(g=>{
    const b = document.createElement("button");
    b.className = "act-btn";
    b.innerHTML = `<b>${g}</b>`;
    b.onclick = () => { gender = g; renderStatus(); renderGradeSelect(); };
    box.appendChild(b);
  });
}

function renderGradeSelect(){
  const box = $("actions");
  box.innerHTML = `<div class="sec-label">∎ 选择你的年级,开始本学期</div>`;
  Object.keys(GRADES).forEach(g=>{
    const b = document.createElement("button");
    b.className = "act-btn";
    b.innerHTML = `<b>${g}</b>`;
    b.onclick = () => startGame(g);
    box.appendChild(b);
  });
}

async function startGame(g){
  if(busy) return;
  grade = g;
  renderStatus();
  setBusy(true);
  $("err").textContent = "";
  try{
    const r = await callGM(
`游戏开始。玩家性别:${gender};年级:${grade},本学期专业课:${GRADES[grade].courses}。
请生成开场:第1周,新学期第一天的紫金港,结合该年级的处境(课业/住宿/升学压力等)介绍玩家,并安排一次自然的初遇(引出 1~2 名可攻略角色)。若玩家为大四,请在开场指明随机抽到的两门高难度选修课名。
【当前状态】${JSON.stringify(state)}
【本回合 d20】${1+Math.floor(Math.random()*20)}
请按格式只输出 JSON。`);
    const oldState = JSON.parse(JSON.stringify(state));
    state = sanitize(r.state, oldState);
    memory = r.memory || "";
    lastNarrative = r.narrative || "";
    addTurn({ narrative: r.narrative, delta: diffState(oldState, state) });
    renderStatus();
    renderActions(r.actions, false);
  }catch(e){
    console.error(e);
    $("err").textContent = "开场生成失败,请重新选择年级再试一次。";
    renderGradeSelect();
  }finally{
    setBusy(false);
  }
}

renderGenderSelect();
renderStatus();
</script>
